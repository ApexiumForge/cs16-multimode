// Torbeshi modest weapon feel preset, including Classic.
// Grounded and stationary rifles/pistols/SMGs/M249 only.
// 1.0 restores the native value; live disable: mm_weapon_tuning 0
mm_weapon_tuning "1"
mm_weapon_spread_scale "0.65"
mm_weapon_recoil_scale "0.60"
mm_weapon_moving_spread_scale "0.60" ; 40 percent lower grounded movement spread

// Easier grounded SMG handling (MAC10, TMP, MP5, UMP45 and P90).
mm_weapon_smg_spread_scale "0.50"
mm_weapon_smg_moving_spread_scale "0.50"
mm_weapon_smg_recoil_scale "0.50"


// Short taps/bursts: opening 3 shots, renewed after a 0.25-second firing pause.
mm_weapon_burst_tuning "1"
mm_weapon_burst_shots "3"
mm_weapon_burst_reset "0.25"
mm_weapon_burst_spread_scale "0.35"
mm_weapon_burst_moving_spread_scale "0.40"
mm_weapon_burst_recoil_scale "0.40"

// Near-stop shots use the stationary burst profile once speed is below 20.
mm_weapon_settled_speed "20.0"

