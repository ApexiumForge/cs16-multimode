<body style="background:#14191f;color:#e7edf3;font:16px Arial,sans-serif">
<h2 style="color:#8fdc9e">Deathrun</h2>
<p><b>CT runners:</b> Dodge the traps and reach the finish. Watch the floor and time your jumps.</p>
<p><b>T operator:</b> Use the buttons along the control lane to stop the runners.</p>
<p>The operator rotates each round. Two players are needed for a proper run.</p>
<p>Use <b>/votemap</b> to vote for another Deathrun map.</p>
